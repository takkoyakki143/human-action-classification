[project]
name = "human-action-classification"
version = "0.1.0"
description = "Human action classification using ResNet18 and transfer learning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "tqdm>=4.70.1",
]
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
